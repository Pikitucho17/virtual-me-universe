<!DOCTYPE html>
<!--
  ============================================================================
  VIRTUAL ME · UNIVERSE — custom Web template.

  WHY THIS EXISTS: a Web build used to overwrite Builds/Web/index.html with
  Unity's default (grey 960x600 canvas, Unity chrome, no app messaging). The
  good file had to be restored BY HAND after every single build, and forgetting
  once silently breaks the Universe tab. As a template, Unity emits this file
  automatically on every build and the trap is gone.

  Select it at: Player Settings ▸ Resolution and Presentation ▸ WebGL Template.

  DO NOT "simplify" the two postMessage calls: UniverseTab.js LISTENS for
  galaxy-ready / galaxy-error. Without galaxy-error, a galaxy that fails to load
  hangs on the boot screen forever instead of showing "try again".

  FILENAMES ARE HARDCODED ON PURPOSE ("Web.*"). Unity template macros would be
  more elegant, but this file is byte-identical to the loader already proven in
  production, and a wrong macro name costs a 12-minute build to discover. The
  build target has always been "Web". If it is ever renamed, update the four
  Build/Web.* paths below — that is the whole maintenance cost.

  WARNING: Unity's Preprocess.js evaluates triple-brace macro expressions ANYWHERE
  in this file, INCLUDING inside HTML comments. An empty example one written here
  to document the syntax killed a build with:
      Preprocessor error "TypeError: Cannot read property 'toString' of undefined"
      ... when evaluating expression " "
  Never type a macro expression in this file unless it is a real, named one.
  ============================================================================
-->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Virtual Me · Universe</title>
    <style>
      html, body {
        margin: 0; padding: 0; border: 0;
        width: 100%; height: 100%;
        background: #05070f;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
        background: #05070f;
        touch-action: none;
      }
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #05070f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity .45s ease;
        z-index: 10;
      }
      #boot .kicker {
        font-size: 11px; font-weight: 900; letter-spacing: 3px;
        color: #00E5FF; margin-bottom: 18px;
      }
      #bar {
        width: 180px; height: 3px; border-radius: 2px;
        background: rgba(0, 229, 255, 0.15); overflow: hidden;
      }
      #fill { width: 0%; height: 100%; background: #00E5FF; transition: width .2s ease; }
      #err {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        padding: 28px; text-align: center;
        background: #05070f; color: #8a93a8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px; line-height: 20px; z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="boot">
      <div class="kicker">ENTERING THE UNIVERSE</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="err"><span id="errtext"></span></div>

    <script src="Build/Web.loader.js?v=202607252113"></script>
    <script>
      var boot = document.getElementById('boot');
      var fill = document.getElementById('fill');

      // ===== MOBILE MEMORY (2026-07-25) =================================
      // A tester's iPhone died with abort("OOM") / abortOnCannotGrowMemory while
      // opening the Universe tab. The single biggest cause is the BACKING STORE:
      // at devicePixelRatio 2 on a ~1170x2532 phone Unity allocates a ~2340x5064
      // framebuffer plus every render target at that size, which blows straight
      // past what iOS WKWebView will hand a single web view. Rendering at dpr 1
      // on phones cuts that to a QUARTER and costs almost nothing visually on a
      // screen this small. Desktop is untouched.
      var VM_IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
      var VM_DPR = VM_IS_MOBILE ? 1 : Math.min(window.devicePixelRatio || 1, 2);

      // Unity aborts (including OOM) surface as a raw browser alert() full of wasm
      // stack frames - which is exactly what the tester saw. Intercept it, show our
      // own panel, and tell the app so the tab never hangs on the boot screen.
      function vmFail(detail) {
        var oom = /OOM|CannotGrowMemory|out of memory/i.test(String(detail || ''));
        try { boot.style.display = 'none'; } catch (e) {}
        var lost = /webglcontextlost/i.test(String(detail || ''));
        var stalled = /never-rendered/i.test(String(detail || ''));
        document.getElementById('errtext').textContent = oom
          ? 'The galaxy ran out of memory on this device. Close other apps and tabs, then open the Universe again.'
          : lost
            ? 'This device stopped the 3D view to free memory (GPU). Close your other apps, then open the Universe again.'
            : stalled
              ? 'The galaxy loaded but this device could not start the 3D view. Close your other apps and reopen the Universe - if it keeps happening, tell Richard which iPhone you have.'
              : 'The galaxy could not load. Check your connection and try again.';
        document.getElementById('err').style.display = 'flex';
        try {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
              type: 'galaxy-error', reason: oom ? 'oom' : 'load', message: String(detail || ''),
            }));
          }
        } catch (e) {}
      }
      // A DEVICE CAN FAIL WITHOUT EVER ABORTING (2026-07-25). One tester's iPhone
      // showed a totally black Universe: no galaxy, and none of Unity's own UI
      // (search bar, My Planets, home button) - while the SAME build rendered fine
      // on another iPhone. Unity resolved, nothing threw, so no alert and no catch.
      // That is iOS killing the WebGL context under GPU/memory pressure, or the
      // render loop never starting. Both are invisible without these two probes,
      // and a black screen with no explanation is the worst thing a tester can get.
      // The wording differs per cause ON PURPOSE so a screenshot tells us which.
      (function () {
        var cv = document.querySelector('#unity-canvas');
        if (!cv) return;
        cv.addEventListener('webglcontextlost', function (ev) {
          try { ev.preventDefault(); } catch (e) {}
          vmFail('webglcontextlost');
        }, false);
      })();

      var vmNativeAlert = window.alert;
      window.alert = function (msg) {
        var m = String(msg || '');
        if (/Unity|abort\(|OOM|wasm/i.test(m)) { vmFail(m); return; }
        return vmNativeAlert.apply(window, arguments);
      };
      window.addEventListener('error', function (e) {
        var m = (e && e.message) || '';
        if (/OOM|CannotGrowMemory|out of memory/i.test(m)) vmFail(m);
      });

      createUnityInstance(document.querySelector('#unity-canvas'), {
        arguments: [],
        dataUrl: 'Build/Web.data.unityweb?v=202607252113',
        frameworkUrl: 'Build/Web.framework.js.unityweb?v=202607252113',
        codeUrl: 'Build/Web.wasm.unityweb?v=202607252113',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'MoneyMapGroup',
        productName: 'Virtual Me Universe',
        productVersion: '0.1.0',
        matchWebGLToCanvasSize: true,
        devicePixelRatio: VM_DPR,
      }, function (progress) {
        fill.style.width = (progress * 100) + '%';
      }).then(function () {
        // WATCHDOG: Unity resolved, but did it ever actually DRAW? If the backing
        // store is still the browser default 300x150 well after load, the render
        // loop never ran and the user is staring at black with no idea why.
        setTimeout(function () {
          try {
            var cv = document.querySelector('#unity-canvas');
            if (cv && cv.width <= 300 && cv.height <= 150 && document.visibilityState === 'visible') {
              vmFail('never-rendered');
            }
          } catch (e) {}
        }, 15000);
        setTimeout(function () { boot.style.display = 'none'; }, 500);
        try {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'galaxy-ready' }));
          }
        } catch (e) {}
      }).catch(function (message) {
        vmFail(message);
      });
    </script>
  </body>
</html>
